name: Build and Deploy
on:
  push:
    branches:
      - master
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Restore published Instagram selection
        run: node scripts/restore-instagram.cjs

      - name: Install dependencies
        run: npm ci

      - name: Verify data and recovery
        run: npm run test:unit

      - name: Synchronize Instagram
        run: node scripts/sync-instagram.cjs
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}

      - name: Build
        run: npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@4.1.3
        with:
          branch: release
          folder: docs
          clean: true
