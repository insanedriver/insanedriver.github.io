name: Build and Deploy
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # The unit tests read the built site (docs/sitemap.xml, docs/robots.txt), so build first.
      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@4.1.3
        with:
          branch: release
          folder: docs
          clean: true
